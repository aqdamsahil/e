<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="posterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Poster Canvas Container with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- White Poster Sheet -->
    <rect x="120" y="86" width="272" height="340" rx="16" fill="url(#posterGrad)"/>

    <!-- Poster Inner Artwork Frame -->
    <rect x="136" y="102" width="240" height="250" rx="10" fill="#042f2e"/>

    <!-- Artwork inside poster -->
    <g clip-path="url(#artworkClip)">
      <clipPath id="artworkClip">
        <rect x="136" y="102" width="240" height="250" rx="10"/>
      </clipPath>

      <!-- Night sky & gradient inside frame -->
      <rect x="136" y="102" width="240" height="250" fill="#0f172a"/>
      
      <!-- Radiant Sun -->
      <circle cx="210" cy="170" r="38" fill="url(#sunGrad)"/>

      <!-- Mountain back -->
      <polygon points="110,352 230,200 330,352" fill="url(#mountain2)" opacity="0.9"/>
      <!-- Mountain front -->
      <polygon points="210,352 290,230 400,352" fill="url(#mountain1)"/>

      <!-- Geometric landscape grid accent lines -->
      <line x1="136" y1="320" x2="376" y2="320" stroke="#2dd4bf" stroke-width="2" opacity="0.4"/>
      <line x1="136" y1="334" x2="376" y2="334" stroke="#2dd4bf" stroke-width="1.5" opacity="0.25"/>
    </g>

    <!-- Poster Typography Lines (Swiss style poster signature) -->
    <rect x="140" y="366" width="100" height="12" rx="3" fill="#0f766e"/>
    <rect x="140" y="386" width="60" height="8" rx="2" fill="#94a3b8"/>
    <rect x="140" y="400" width="140" height="6" rx="2" fill="#cbd5e1"/>

    <!-- Brand stamp dot -->
    <circle cx="356" cy="380" r="14" fill="#0d9488"/>
    <!-- Download / P arrow inside stamp -->
    <path d="M356 373 v10 M352 380 l4 4 l4 -4" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
